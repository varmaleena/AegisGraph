services:
  - type: web
    name: aegisgraph-api
    runtime: docker
    plan: free
    repo: https://github.com/varmaleena/AegisGraph
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m backend.cloud_start
    healthCheckPath: /health
    envVars:
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_SSL
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
